name: Build and Release Apps

on:
  push:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Choose release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Install current dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        env:
          APP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python build.py

      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -yr YTDownloader-macOS.zip YTDownloader.app

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czf dist/YTDownloader-Linux.tar.gz -C dist YTDownloader-Linux

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/YTDownloader-Windows.exe
          if-no-files-found: error

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/YTDownloader-macOS.zip
          if-no-files-found: error

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/YTDownloader-Linux.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Check release files
        run: |
          test -s release/YTDownloader-Windows.exe
          test -s release/YTDownloader-macOS.zip
          test -s release/YTDownloader-Linux.tar.gz

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
