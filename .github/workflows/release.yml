name: Build and Release Apps

# Скрипт запускается каждый раз, когда вы создаете новый тег версии (например, v1.0)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой на GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Собираем сразу на трех ОС!
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- Сборка для Windows ---
    - name: Build Windows (.exe)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --noconsole --onefile --icon=icon.ico --name "YTDownloader-Windows" app.py

    # --- Сборка для Linux ---
    - name: Build Linux (Executable)
      if: matrix.os == 'ubuntu-latest'
      run: pyinstaller --noconsole --onefile --name "YTDownloader-Linux" app.py

    # --- Сборка для macOS ---
    - name: Build macOS (.app)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --windowed --icon=icon.icns --name "YTDownloader" app.py
        cd dist
        # На Маке мы ОБЯЗАТЕЛЬНО архивируем .app, иначе GitHub сломает права файла
        zip -r YTDownloader-macOS.zip YTDownloader.app

    # --- Публикация готовых файлов в раздел Releases ---
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/YTDownloader-Windows.exe
          dist/YTDownloader-Linux
          dist/YTDownloader-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}